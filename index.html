<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wizarding World Spellcaster</title>
  <style>
    html, body { margin: 0; height: 100%; background: #05030a; color: #e8dcff;
      font-family: Georgia, "Times New Roman", serif; overflow: hidden; }
    #stage { position: fixed; inset: 0; }
    /* Video and canvas are mirrored together, so canvas x = mirrored video x. */
    #video, #fx { position: absolute; inset: 0; width: 100%; height: 100%;
      transform: scaleX(-1); }
    #video { object-fit: cover; }
    #fx { pointer-events: none; }

    #start { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(circle at center, #1b1030, #05030a); z-index: 10; }
    #start h1 { font-size: clamp(28px, 5vw, 56px); margin: 0; letter-spacing: 2px; }
    #start p { margin: 0; opacity: .75; }
    button { font: inherit; font-size: 22px; padding: 14px 34px; border-radius: 999px;
      border: 1px solid #b89cff; background: #2a1750; color: #fff; cursor: pointer; }
    button:hover { background: #3b2270; }

    #status { position: fixed; top: 10px; left: 10px; z-index: 5; font-size: 14px;
      background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 8px;
      line-height: 1.6; }
    #status.hidden { display: none; }
    #status button { font-size: 13px; padding: 4px 10px; margin-right: 6px; }
    #banner { position: fixed; bottom: 8%; left: 0; right: 0; text-align: center; z-index: 6;
      font-size: clamp(28px, 6vw, 64px); letter-spacing: 3px; opacity: 0;
      text-shadow: 0 0 24px #b89cff; transition: opacity .6s; pointer-events: none; }
    #banner.show { opacity: 1; transition: opacity .1s; }
    .ok::before   { content: "● "; color: #5CE07A; }
    .wait::before { content: "● "; color: #F2C14E; }
    .bad::before  { content: "● "; color: #FF5D5D; }
  </style>
</head>
<body>
  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="fx"></canvas>
  </div>

  <div id="status">
    <div id="st-cam" class="wait">Camera: not started</div>
    <div id="st-mic" class="wait">Microphone: not started</div>
    <div id="st-speech" class="wait">Speech API: checking</div>
    <div id="st-hands" class="wait">Hand tracking: not started</div>
    <div id="st-trail" class="wait">Drawing: none</div>
    <div id="st-speech-live" class="wait">Voice: not started</div>
    <div id="st-heard" style="opacity:.8;max-width:420px">Heard: -</div>
    <div id="st-btns" style="margin-top:6px"></div>
    <div id="st-log" style="opacity:.7">Keys: D = panel, F = fullscreen, L = landmarks, B = drawing box, C = clear trail</div>
  </div>

  <div id="banner"></div>

  <div id="start">
    <h1>The Wizarding World Spellcaster</h1>
    <p>Allow camera and microphone when asked.</p>
    <button id="start-btn">Begin</button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
